# Render Blueprint: connect this repository once, then each push to main deploys.
services:
  - type: web
    name: campus-nexus-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: campus-nexus-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: campus-nexus-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: campus-nexus-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: campus-nexus-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: campus-nexus-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: keyvalue
    name: campus-nexus-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: campus-nexus-db
    databaseName: campus_nexus
    user: campus
