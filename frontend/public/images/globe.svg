<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#021411" stop-opacity="0"/>
    </radialGradient>
    <filter id="globeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="url(#globeGrad)"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.6" filter="url(#globeGlow)"/>

  <!-- Latitude lines -->
  <ellipse cx="250" cy="250" rx="200" ry="60" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="250" cy="250" rx="200" ry="120" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="250" cy="250" rx="200" ry="170" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Longitude lines -->
  <ellipse cx="250" cy="250" rx="60" ry="200" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="250" cy="250" rx="120" ry="200" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="250" cy="250" rx="170" ry="200" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="50" x2="250" y2="450" stroke="#5EEAD4" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#5EEAD4" stroke-width="1.5" opacity="0.7"/>

  <!-- Network Nodes & Glowing Pulses -->
  <g fill="#00F5A0" filter="url(#globeGlow)">
    <circle cx="210" cy="180" r="6"/>
    <circle cx="310" cy="210" r="5"/>
    <circle cx="160" cy="280" r="5.5"/>
    <circle cx="360" cy="290" r="6"/>
    <circle cx="250" cy="320" r="5"/>
    <circle cx="280" cy="130" r="4.5"/>
    <circle cx="140" cy="170" r="4"/>
  </g>

  <!-- Connection Edges -->
  <g stroke="#5EEAD4" stroke-width="1.5" opacity="0.7">
    <line x1="210" y1="180" x2="310" y2="210"/>
    <line x1="210" y1="180" x2="160" y2="280"/>
    <line x1="160" y1="280" x2="250" y2="320"/>
    <line x1="250" y1="320" x2="360" y2="290"/>
    <line x1="310" y1="210" x2="360" y2="290"/>
    <line x1="210" y1="180" x2="280" y2="130"/>
    <line x1="140" y1="170" x2="210" y2="180"/>
  </g>
</svg>
