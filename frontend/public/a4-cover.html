<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regal Burgundy & Metallic Gold A4 Cover Design</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap');

    :root {
      --gold-primary: #dfb664;
      --gold-light: #fef4cd;
      --gold-dark: #aa792c;
      --burgundy-deep: #1e0409;
      --burgundy-rich: #380912;
      --burgundy-glow: #520f1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0e0204;
      color: #f7e8c3;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Floating Toolbar */
    .controls {
      position: fixed;
      top: 20px;
      z-index: 100;
      background: rgba(30, 4, 9, 0.85);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(223, 182, 100, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .controls span {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--gold-light);
    }

    .btn {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      color: #1a0307;
      border: none;
      border-radius: 30px;
      padding: 8px 18px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(223, 182, 100, 0.3);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(223, 182, 100, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--gold-light);
      border: 1px solid var(--gold-primary);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(223, 182, 100, 0.15);
      box-shadow: 0 0 15px rgba(223, 182, 100, 0.3);
    }

    /* A4 Container */
    .a4-page {
      width: 210mm;
      height: 297mm;
      position: relative;
      background: radial-gradient(circle at 50% 45%, var(--burgundy-glow) 0%, var(--burgundy-rich) 50%, var(--burgundy-deep) 90%);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(223, 182, 100, 0.15);
      margin-top: 50px;
      overflow: hidden;
    }

    /* Background SVG Cover Frame */
    .svg-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Center Editable Content Overlay */
    .cover-content {
      position: absolute;
      inset: 40mm 28mm;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .cover-content.hidden-text {
      opacity: 0;
      pointer-events: none;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #fef4cd 0%, #dfb664 35%, #fff1b8 70%, #aa792c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
    }

    .institution-name {
      font-family: 'Cinzel', serif;
      font-size: 15pt;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .sub-faculty {
      font-size: 9pt;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(254, 244, 205, 0.75);
      margin-top: 6px;
    }

    .crest-divider {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      margin: 18px auto 0;
      position: relative;
    }

    .crest-divider::after {
      content: '✦';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-primary);
      font-size: 10px;
      background: var(--burgundy-rich);
      padding: 0 4px;
    }

    .title-block {
      margin: auto 0;
      max-width: 90%;
    }

    .project-type-tag {
      font-family: 'Cinzel', serif;
      font-size: 10pt;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 32pt;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 11pt;
      font-weight: 300;
      letter-spacing: 2px;
      line-height: 1.6;
      color: rgba(254, 244, 205, 0.85);
      font-style: italic;
    }

    .footer-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 24px;
      border-top: 1px solid rgba(223, 182, 100, 0.25);
    }

    .meta-col {
      text-align: left;
    }

    .meta-col.right {
      text-align: right;
    }

    .meta-label {
      font-family: 'Cinzel', serif;
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 10pt;
      font-weight: 500;
      color: var(--gold-light);
      line-height: 1.4;
    }

    /* Print Styles */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .controls {
        display: none !important;
      }
      .a4-page {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Top Action Controls -->
  <div class="controls">
    <span>A4 LUXURY COVER DESIGN</span>
    <button class="btn btn-secondary" onclick="toggleSource()">Switch to Vector SVG</button>
    <button class="btn btn-secondary" onclick="toggleTypography()">Toggle Text Overlay</button>
    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <!-- A4 Printable Page -->
  <div class="a4-page" id="printablePage">
    <!-- Embedded Full-Scale High-Resolution Rendered Cover -->
    <img id="coverImg" src="/images/burgundy_gold_project_cover.jpg" class="svg-frame" alt="Burgundy and Gold Ornate A4 Frame">

    <!-- Optional Typography Overlay (Can be customized or toggled completely off for blank center) -->
    <div class="cover-content" id="coverContent">
      <div class="header-block">
        <div class="institution-name gold-gradient-text" contenteditable="true">INSTITUTION OR UNIVERSITY NAME</div>
        <div class="sub-faculty" contenteditable="true">Department of Computer Science & Engineering</div>
        <div class="crest-divider"></div>
      </div>

      <div class="title-block">
        <div class="project-type-tag" contenteditable="true">PROJECT REPORT / DISSERTATION</div>
        <h1 class="main-title gold-gradient-text" contenteditable="true">CAMPUS-NEXUS</h1>
        <p class="subtitle" contenteditable="true">Cognitive Campus Operating System with AI Intelligence</p>
      </div>

      <div class="footer-meta">
        <div class="meta-col">
          <div class="meta-label">Submitted By</div>
          <div class="meta-value" contenteditable="true">Candidate Name<br>Roll No: 2026-CS-042</div>
        </div>
        <div class="meta-col right">
          <div class="meta-label">Academic Year</div>
          <div class="meta-value" contenteditable="true">2025 – 2026<br>Semester VIII</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isSvg = false;
    function toggleSource() {
      const img = document.getElementById('coverImg');
      const btn = event.target;
      isSvg = !isSvg;
      if (isSvg) {
        img.src = '/images/burgundy_gold_a4_cover.svg';
        btn.textContent = 'Switch to Realistic Render';
      } else {
        img.src = '/images/burgundy_gold_project_cover.jpg';
        btn.textContent = 'Switch to Vector SVG';
      }
    }

    function toggleTypography() {
      const el = document.getElementById('coverContent');
      el.classList.toggle('hidden-text');
    }
  </script>
</body>
</html>
